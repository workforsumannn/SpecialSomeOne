<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ek Chhoti Si Kitab - Subhashree Ji Ke Liye</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
  }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: #0d001a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    color: #fff;
    padding: 20px 12px;
    perspective: 2400px;
    position: relative;
  }

  /* ================================================
     WOODEN TABLE BACKGROUND
     ================================================ */
  .table-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      /* Wood grain */
      repeating-linear-gradient(
        92deg,
        rgba(60, 35, 18, 0.0) 0px,
        rgba(60, 35, 18, 0.0) 2px,
        rgba(40, 22, 10, 0.5) 2px,
        rgba(40, 22, 10, 0.5) 3px,
        rgba(60, 35, 18, 0.0) 3px,
        rgba(60, 35, 18, 0.0) 7px
      ),
      repeating-linear-gradient(
        88deg,
        rgba(80, 50, 25, 0.2) 0px,
        rgba(80, 50, 25, 0.2) 15px,
        rgba(50, 30, 15, 0.35) 15px,
        rgba(50, 30, 15, 0.35) 30px
      ),
      radial-gradient(ellipse at 50% 30%, #6b4423 0%, #4a2e15 35%, #2a1809 70%, #140a04 100%);
    background-size: 8px 100%, 60px 100%, 100% 100%;
  }
  .table-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, transparent 30%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
  }

  /* Stars (subtle) */
  .star {
    position: fixed;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s infinite;
    z-index: 1;
    opacity: 0.5;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; }
    50%      { opacity: 1; box-shadow: 0 0 8px #fff; }
  }

  /* ================================================
     SCREEN SYSTEM
     ================================================ */
  .screen {
    display: none;
    width: 100%;
    max-width: 1000px;
    z-index: 10;
    animation: fadeIn 0.9s ease;
    position: relative;
  }
  .screen.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ================================================
     LOGIN — looks like a closed book / diary cover
     ================================================ */
  .login-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 90vh;
  }

  .login-card {
    position: relative;
    background:
      linear-gradient(135deg, #6b2a1e 0%, #4a1a12 50%, #3a1009 100%);
    border-radius: 6px 16px 16px 6px;
    padding: 55px 42px;
    max-width: 460px;
    width: 100%;
    text-align: center;
    box-shadow:
      /* Book thickness */
      0 0 0 1px rgba(255, 200, 150, 0.15),
      inset 0 0 0 1px rgba(255, 200, 150, 0.08),
      inset 0 0 60px rgba(0, 0, 0, 0.5),
      /* 3D depth */
      12px 12px 0 -2px #2a0d07,
      14px 14px 0 -2px #1a0603,
      20px 20px 60px rgba(0, 0, 0, 0.8),
      0 40px 80px rgba(0, 0, 0, 0.6);
    border-left: 6px solid #2a0d07;
  }

  /* Embossed border on the cover */
  .login-card::before {
    content: '';
    position: absolute;
    inset: 14px;
    border: 1.5px solid rgba(220, 180, 120, 0.3);
    border-radius: 4px 12px 12px 4px;
    pointer-events: none;
  }

  .lock-svg {
    width: 60px; height: 60px;
    margin-bottom: 18px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.08); }
  }

  .login-title {
    font-family: 'Georgia', serif;
    font-size: 1.75em;
    margin-bottom: 12px;
    color: #e8c88a;
    text-shadow:
      0 1px 0 rgba(0,0,0,0.7),
      0 0 20px rgba(232, 200, 138, 0.4);
    font-style: italic;
    letter-spacing: 1.5px;
  }

  .login-sub {
    font-size: 0.92em;
    color: #d4b483;
    margin-bottom: 28px;
    font-style: italic;
    opacity: 0.9;
    line-height: 1.7;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  .pin-input {
    width: 100%;
    padding: 16px;
    font-size: 1.5em;
    text-align: center;
    letter-spacing: 14px;
    border-radius: 8px;
    border: 1.5px solid rgba(220, 180, 120, 0.4);
    background: rgba(0, 0, 0, 0.25);
    color: #e8c88a;
    font-family: 'Courier New', monospace;
    outline: none;
    transition: all 0.3s;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
  }
  .pin-input:focus {
    border-color: #e8c88a;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 0 20px rgba(232, 200, 138, 0.35);
  }
  .pin-input::placeholder {
    color: rgba(232, 200, 138, 0.35);
    letter-spacing: 5px;
    font-size: 0.65em;
  }

  .hint {
    font-size: 0.8em;
    color: #b89a6a;
    margin-top: 12px;
    opacity: 0.8;
    font-style: italic;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  .unlock-btn {
    margin-top: 24px;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    font-size: 1em;
    font-weight: 700;
    font-family: 'Georgia', serif;
    font-style: italic;
    cursor: pointer;
    background: linear-gradient(180deg, #e8c88a 0%, #c9a666 50%, #a88545 100%);
    color: #3a1a0a;
    box-shadow:
      0 1px 0 rgba(255, 240, 200, 0.5) inset,
      0 -2px 0 rgba(0, 0, 0, 0.25) inset,
      0 6px 16px rgba(0, 0, 0, 0.5);
    transition: all 0.25s;
    letter-spacing: 1.5px;
    text-shadow: 0 1px 0 rgba(255, 240, 200, 0.3);
  }
  .unlock-btn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 1px 0 rgba(255, 240, 200, 0.5) inset,
      0 -2px 0 rgba(0, 0, 0, 0.25) inset,
      0 10px 24px rgba(232, 200, 138, 0.35);
  }
  .unlock-btn:active { transform: translateY(0); }

  .error {
    color: #ff9a7a;
    font-size: 0.85em;
    margin-top: 14px;
    min-height: 20px;
    opacity: 0;
    transition: opacity 0.3s;
    font-style: italic;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .error.show { opacity: 1; }

  .shake { animation: shakeCard 0.5s ease; }
  @keyframes shakeCard {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-12px); }
    40% { transform: translateX(12px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }

  /* ================================================
     THE OPEN BOOK — premium, realistic
     ================================================ */
  .book-wrap {
    display: flex;
    justify-content: center;
    padding: 20px 0;
    perspective: 2800px;
  }

  .book {
    position: relative;
    width: 100%;
    max-width: 980px;
    height: 680px;
    transform-style: preserve-3d;
    filter:
      drop-shadow(0 40px 50px rgba(0, 0, 0, 0.9))
      drop-shadow(0 15px 25px rgba(0, 0, 0, 0.7))
      drop-shadow(0 0 60px rgba(255, 180, 120, 0.08));
  }

  /* The open book body */
  .book-body {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 4px 14px 14px 4px;
    background: #2a1a12;
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,0.6),
      /* Book spine binding (left edge) */
      -3px 0 0 rgba(0,0,0,0.4),
      -5px 0 0 #1a0d08,
      -7px 0 0 rgba(0,0,0,0.3);
  }

  /* Deep shadow in the center spine */
  .book-body::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 60px;
    transform: translateX(-50%);
    background:
      linear-gradient(90deg,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0.15) 25%,
        rgba(0,0,0,0.55) 45%,
        rgba(0,0,0,0.75) 50%,
        rgba(0,0,0,0.55) 55%,
        rgba(0,0,0,0.15) 75%,
        rgba(0,0,0,0) 100%);
    z-index: 20;
    pointer-events: none;
  }

  /* Thin vertical stitch line in center */
  .book-body::after {
    content: '';
    position: absolute;
    top: 8%;
    bottom: 8%;
    left: 50%;
    width: 1px;
    transform: translateX(-50%);
    background: linear-gradient(180deg, transparent, rgba(120, 80, 40, 0.4) 15%, rgba(120, 80, 40, 0.4) 85%, transparent);
    z-index: 21;
    pointer-events: none;
  }

  /* LEFT PAGE */
  .page-left {
    position: absolute;
    top: 0; bottom: 0;
    left: 0;
    width: 50%;
    border-radius: 4px 0 0 4px;
    overflow: hidden;
    z-index: 5;
    background:
      /* Aged paper — warm cream with subtle blotches */
      radial-gradient(circle at 25% 20%, rgba(180, 140, 90, 0.10) 0%, transparent 40%),
      radial-gradient(circle at 70% 65%, rgba(160, 120, 70, 0.08) 0%, transparent 45%),
      radial-gradient(circle at 15% 85%, rgba(150, 110, 60, 0.07) 0%, transparent 35%),
      linear-gradient(160deg, #f4e9d0 0%, #ecdec0 40%, #e0d0b0 100%);
    box-shadow:
      inset -20px 0 40px -20px rgba(80, 50, 20, 0.55),
      inset 6px 0 12px -8px rgba(255, 250, 230, 0.8),
      inset 0 4px 8px -4px rgba(120, 80, 40, 0.2),
      inset 0 -4px 8px -4px rgba(120, 80, 40, 0.2);
  }

  /* RIGHT PAGE */
  .page-right {
    position: absolute;
    top: 0; bottom: 0;
    right: 0;
    width: 50%;
    border-radius: 0 14px 14px 0;
    overflow: hidden;
    z-index: 5;
    background:
      radial-gradient(circle at 75% 20%, rgba(180, 140, 90, 0.10) 0%, transparent 40%),
      radial-gradient(circle at 30% 70%, rgba(160, 120, 70, 0.08) 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(150, 110, 60, 0.07) 0%, transparent 35%),
      linear-gradient(200deg, #f4e9d0 0%, #ecdec0 40%, #e0d0b0 100%);
    box-shadow:
      inset 20px 0 40px -20px rgba(80, 50, 20, 0.55),
      inset -6px 0 12px -8px rgba(255, 250, 230, 0.8),
      inset 0 4px 8px -4px rgba(120, 80, 40, 0.2),
      inset 0 -4px 8px -4px rgba(120, 80, 40, 0.2);
  }

  /* Paper fiber texture overlay */
  .paper-fiber {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    z-index: 6;
    background-image:
      repeating-linear-gradient(45deg,
        rgba(140, 100, 60, 0.04) 0px,
        rgba(140, 100, 60, 0.04) 1px,
        transparent 1px,
        transparent 3px),
      repeating-linear-gradient(-30deg,
        rgba(120, 90, 50, 0.03) 0px,
        rgba(120, 90, 50, 0.03) 1px,
        transparent 1px,
        transparent 4px);
  }

  /* Faint horizontal rule lines */
  .paper-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.18;
    z-index: 6;
    background-image:
      repeating-linear-gradient(180deg,
        transparent 0px,
        transparent 31px,
        rgba(120, 80, 40, 0.35) 31px,
        rgba(120, 80, 40, 0.35) 32px);
    background-position: 0 20px;
  }

  /* Page curl shadow at outer edges */
  .page-left::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 0;
    width: 20px;
    background: linear-gradient(90deg, rgba(60, 30, 10, 0.35) 0%, transparent 100%);
    pointer-events: none;
    z-index: 8;
  }
  .page-right::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    right: 0;
    width: 20px;
    background: linear-gradient(-90deg, rgba(60, 30, 10, 0.35) 0%, transparent 100%);
    pointer-events: none;
    z-index: 8;
  }

  /* PAGE CONTENT */
  .page-content {
    position: absolute;
    inset: 0;
    padding: 52px 48px 60px;
    color: #3a2515;
    font-family: 'Georgia', 'Times New Roman', serif;
    display: flex;
    flex-direction: column;
    z-index: 7;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(120,80,40,0.4) transparent;
  }
  .page-content::-webkit-scrollbar { width: 4px; }
  .page-content::-webkit-scrollbar-thumb { background: rgba(120,80,40,0.4); border-radius: 4px; }

  .page-content h2 {
    font-family: 'Georgia', serif;
    font-size: 1.6em;
    color: #7a2a3a;
    margin-bottom: 6px;
    font-style: italic;
    letter-spacing: 0.5px;
    line-height: 1.3;
    text-shadow: 0 1px 0 rgba(255, 250, 230, 0.5);
  }
  .page-content .date {
    font-size: 0.78em;
    color: #8a6a40;
    margin-bottom: 24px;
    font-style: italic;
    letter-spacing: 0.5px;
  }
  .page-content p {
    font-size: 0.97em;
    line-height: 1.9;
    margin-bottom: 14px;
    color: #3a2515;
    text-align: left;
  }
  .page-content .drop-cap::first-letter {
    font-size: 3em;
    float: left;
    line-height: 0.85;
    padding: 8px 10px 0 0;
    color: #8b2a3a;
    font-family: 'Georgia', serif;
    font-weight: 700;
  }
  .page-content .hl {
    color: #8b2a3a;
    font-weight: 600;
    font-style: italic;
  }
  .page-content .signature {
    margin-top: auto;
    padding-top: 20px;
    font-style: italic;
    color: #6b2a3a;
    font-size: 0.95em;
    text-align: right;
    border-top: 1px dashed rgba(120, 80, 40, 0.35);
  }

  /* PAGE NUMBERS */
  .page-num {
    position: absolute;
    bottom: 20px;
    font-family: 'Georgia', serif;
    font-size: 0.78em;
    color: #8a6a40;
    font-style: italic;
    letter-spacing: 1.5px;
    z-index: 10;
  }
  .page-num.left { left: 30px; }
  .page-num.right { right: 30px; }

  /* ================================================
     PAGE FLIP
     ================================================ */
  .flip-page {
    position: absolute;
    top: 0; bottom: 0;
    width: 50%;
    backface-visibility: hidden;
    pointer-events: none;
    opacity: 0;
    z-index: 15;
    background:
      radial-gradient(circle at 40% 30%, rgba(180, 140, 90, 0.1) 0%, transparent 50%),
      linear-gradient(160deg, #f4e9d0 0%, #ecdec0 40%, #e0d0b0 100%);
  }
  .flip-page.left-side {
    left: 0;
    transform-origin: right center;
    border-radius: 4px 0 0 4px;
    box-shadow: inset -20px 0 40px -20px rgba(80, 50, 20, 0.5);
  }
  .flip-page.right-side {
    right: 0;
    transform-origin: left center;
    border-radius: 0 14px 14px 0;
    box-shadow: inset 20px 0 40px -20px rgba(80, 50, 20, 0.5);
  }
  .flip-page.flipping-right { animation: flipRight 1s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  .flip-page.flipping-left  { animation: flipLeft 1s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  @keyframes flipRight {
    0%   { opacity: 0; transform: rotateY(0deg); }
    10%  { opacity: 1; }
    50%  { box-shadow: -20px 0 40px rgba(0,0,0,0.4); }
    100% { opacity: 0; transform: rotateY(-180deg); }
  }
  @keyframes flipLeft {
    0%   { opacity: 0; transform: rotateY(0deg); }
    10%  { opacity: 1; }
    50%  { box-shadow: 20px 0 40px rgba(0,0,0,0.4); }
    100% { opacity: 0; transform: rotateY(180deg); }
  }

  /* ================================================
     NAV BUTTONS
     ================================================ */
  .nav-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 26px;
    flex-wrap: wrap;
    z-index: 20;
    position: relative;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 30px;
    border-radius: 40px;
    font-family: 'Georgia', serif;
    font-size: 0.98em;
    font-weight: 600;
    font-style: italic;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s;
    border: none;
  }

  .nav-btn.prev-btn {
    background: rgba(60, 30, 15, 0.6);
    color: #e8c88a;
    border: 1px solid rgba(220, 180, 120, 0.35);
    backdrop-filter: blur(10px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,200,150,0.15);
  }
  .nav-btn.prev-btn:hover {
    background: rgba(80, 40, 20, 0.75);
    border-color: #e8c88a;
    transform: translateY(-2px);
  }

  .nav-btn.next-btn {
    background: linear-gradient(180deg, #e8c88a 0%, #c9a666 55%, #a88545 100%);
    color: #3a1a0a;
    box-shadow:
      0 1px 0 rgba(255, 240, 200, 0.5) inset,
      0 -2px 0 rgba(0, 0, 0, 0.25) inset,
      0 8px 22px rgba(232, 200, 138, 0.35);
    text-shadow: 0 1px 0 rgba(255, 240, 200, 0.3);
  }
  .nav-btn.next-btn:hover {
    transform: translateY(-3px);
    box-shadow:
      0 1px 0 rgba(255, 240, 200, 0.5) inset,
      0 -2px 0 rgba(0, 0, 0, 0.25) inset,
      0 14px 30px rgba(232, 200, 138, 0.5);
  }

  .nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none !important;
  }

  .btn-icon { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

  /* ================================================
     IN-PAGE INTERACTIVE ELEMENTS
     ================================================ */
  .heart-btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 11px 22px;
    border-radius: 40px;
    font-family: 'Georgia', serif;
    font-size: 0.9em;
    font-weight: 700;
    font-style: italic;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.3s;
    margin-top: 12px;
    align-self: flex-start;
    background: linear-gradient(180deg, #8b2a3a 0%, #6b1a2a 100%);
    color: #f4e9d0;
    border: 1px solid rgba(120, 20, 40, 0.5);
    box-shadow:
      0 1px 0 rgba(255, 200, 200, 0.2) inset,
      0 6px 16px rgba(120, 30, 50, 0.4);
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .heart-btn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 1px 0 rgba(255, 200, 200, 0.3) inset,
      0 10px 24px rgba(120, 30, 50, 0.6);
  }
  .heart-btn:active { transform: translateY(0); }

  .joke-text {
    font-style: italic;
    color: #6b2a3a;
    font-size: 1.02em;
    line-height: 1.75;
    padding: 16px 18px;
    background: rgba(139, 42, 58, 0.06);
    border-left: 3px solid #8b2a3a;
    border-radius: 0 10px 10px 0;
    margin: 10px 0 14px;
    min-height: 78px;
    transition: opacity 0.3s;
    box-shadow: inset 0 1px 4px rgba(120, 80, 40, 0.08);
  }

  .question-text {
    font-size: 1.2em;
    color: #6b2a3a;
    line-height: 1.7;
    margin: 22px 0 30px;
    font-style: italic;
    text-align: center;
  }

  .qa-row {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
    position: relative;
    min-height: 70px;
  }

  .qa-btn {
    padding: 13px 32px;
    border-radius: 40px;
    font-family: 'Georgia', serif;
    font-size: 1em;
    font-weight: 700;
    font-style: italic;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.4s ease;
    border: none;
  }
  .qa-yes {
    background: linear-gradient(180deg, #8b2a3a 0%, #6b1a2a 100%);
    color: #f4e9d0;
    box-shadow:
      0 1px 0 rgba(255, 200, 200, 0.2) inset,
      0 8px 20px rgba(120, 30, 50, 0.4);
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .qa-yes:hover { transform: translateY(-2px) scale(1.05); }

  .qa-no {
    background: rgba(120, 80, 40, 0.1);
    color: #6b2a3a;
    border: 1px solid rgba(120, 80, 40, 0.4);
  }

  .no-hint {
    font-size: 0.87em;
    color: #8b2a3a;
    font-style: italic;
    text-align: center;
    margin-top: 16px;
    min-height: 22px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .final-heart {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #8b2a3a, #6b1a2a);
    transform: rotate(-45deg);
    position: relative;
    margin: 14px auto 30px;
    animation: heartbeat 1.3s ease-in-out infinite;
    box-shadow: 0 0 28px rgba(139, 42, 58, 0.5);
  }
  .final-heart::before, .final-heart::after {
    content: '';
    position: absolute;
    width: 56px; height: 56px;
    background: inherit;
    border-radius: 50%;
  }

<script>
  /* ===== Subtle stars ===== */

  function goTo(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

  /* ===== PIN + Music autoplay after login ===== */

      error.classList.remove('show');
      goTo('screenBook');
      renderBook();

        voiceAudio.volume = 0.4;

          voicePlaying = true;

          updateVoiceButtons();

      card.classList.add('shake');
      error.classList.add('show');
      setTimeout(() => card.classList.remove('shake'), 500);
      document.getElementById('pinInput').value = '';

  document.getElementById('pinInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') checkPin();

  let currentSpread = 0;

  function renderBook(direction) {
    const spread = SPREADS[currentSpread];
    const leftContent = document.getElementById('leftContent');
    const rightContent = document.getElementById('rightContent');
    const leftNum = document.getElementById('leftNum');
    const rightNum = document.getElementById('rightNum');

    if (direction === 'next') {
      const flip = document.getElementById('flipRight');
      flip.classList.add('flipping-right');
      setTimeout(() => flip.classList.remove('flipping-right'), 1050);
    } else if (direction === 'prev') {
      const flip = document.getElementById('flipLeft');
      flip.classList.add('flipping-left');
      setTimeout(() => flip.classList.remove('flipping-left'), 1050);
    }

    setTimeout(() => {
      leftContent.innerHTML = spread.left.html;
      rightContent.innerHTML = spread.right.html;
      leftNum.textContent = spread.left.pageNum;
      rightNum.textContent = spread.right.pageNum;

      document.getElementById('prevBtn').disabled = currentSpread === 0;
      document.getElementById('nextBtn').disabled = currentSpread === SPREADS.length - 1;

      updateVoiceButtons();
    }, direction ? 500 : 0);
  }

  function nextPage() {
    if (currentSpread < SPREADS.length - 1) {
      currentSpread++;
      renderBook('next');
    }
  }
  function prevPage() {
    if (currentSpread > 0) {
      currentSpread--;
      renderBook('prev');
    }
  }

  /* ===== Voice ===== */
  function updateVoiceButtons() {
    const l1 = document.getElementById('voiceLabelLeft');
    const i1 = document.getElementById('voiceIconLeft');
    if (!l1) return;
    if (voicePlaying) {
      l1.textContent = 'Rukiye...';
      if (i1) i1.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    } else {
      l1.textContent = 'Meri Awaaz Suniye';
      if (i1) i1.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
  }

  function toggleVoice() {
    if (voicePlaying) {
      voiceAudio.pause();
      voiceAudio.currentTime = 0;
      voicePlaying = false;
      updateVoiceButtons();
      document.getElementById('musicBadge').classList.remove('show');
    } else {
      voiceAudio.volume = 0.4;
      voiceAudio.play().then(() => {
        voicePlaying = true;
        updateVoiceButtons();
        spawnNotes();
        document.getElementById('musicBadge').classList.add('show');
      }).catch(() => {
        const l1 = document.getElementById('voiceLabelLeft');
        if (l1) l1.textContent = 'Punah Dabaiye';
      });
    }
  }

  let noteTimer = null;
  function spawnNotes() {
    if (noteTimer) return;
    noteTimer = setInterval(() => {
      if (!voicePlaying) return;
      const n = document.createElement('div');
      n.className = 'note';
      n.style.left = Math.random() * 100 + 'vw';
      n.style.bottom = '0';
      n.style.animationDuration = (3 + Math.random() * 3) + 's';
      document.body.appendChild(n);
      setTimeout(() => n.remove(), 6500);
    }, 700);
  }

    "Meri yantra ki battery 1% par aati hai toh main charger dhoondhta hoon. Aapki muskaan 1% par aati hai toh main duniya bhool jaata hoon.",
    "Aapke bina main aisa hoon jaise bina internet ke phone &mdash; juda dikhta hoon, kintu kaam nahi karta.",
    "Google se poocha &mdash; 'sabse sundar mahila kaun?' Google boli &mdash; 'bhai, aap pehle se jaante hain, jaakar kshama maang lijiye.'",
    "Aap naraaz hoti hain toh bhi sundar lagti hain. Kintu aap hansti hain toh samay ruk jaata hai. Kripya, thodi si muskaan dijiye.",
    "Mera priya samay? Jab aap 'kshama' ke baad 'chalega' kehti hain.",
    "Zindagi mein do cheezein mahatvapurna hain &mdash; chai aur aapki muskaan. Chai mil jaati hai, muskaan ke liye kshama maang raha hoon."
  ];
  let jokeIndex = 0;

  function nextJoke() {
    const jokeBox = document.getElementById('jokeBox');
    if (!jokeBox) return;
    jokeBox.style.opacity = 0;
    setTimeout(() => {
      jokeBox.innerHTML = jokes[jokeIndex % jokes.length];
      jokeBox.style.opacity = 1;
      jokeIndex++;
    }, 180);
  }

  /* ===== Q&A ===== */
  let noCount = 0;
  const noResponses = [
    "Nahi dabaya? Koi baat nahi, main pratiksha karunga.",
    "Ab bhi nahi? Dekhiye, teddy bhi udaas ho raha hai.",
    "Theek hai, ek aur avsar dijiye&hellip; kripya.",
    "Aapki muskaan toh 'haan' keh rahi hai. Bas ek chhota sa chinh.",
    "Chaliye, main pratiksha karunga. Kintu 'Nahi' button dheere-dheere bhaag raha hai.",
    "Aakhri baar anurodh kar raha hoon&hellip; kripya."
  ];

  function sayNo() {
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const noHint = document.getElementById('noHint');
    if (!noBtn) return;

    noCount++;
    const x = (Math.random() - 0.5) * 150;
    const y = (Math.random() - 0.5) * 50;
    noBtn.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
    noBtn.style.fontSize = Math.max(0.7, 1 - noCount * 0.06) + 'em';

    if (yesBtn) yesBtn.style.transform = 'scale(' + Math.min(1.5, 1 + noCount * 0.1) + ')';

    if (noCount <= noResponses.length && noHint) {
      noHint.textContent = noResponses[noCount - 1];
      noHint.style.opacity = 1;
    }
    if (noCount >= 6) {
      noBtn.style.opacity = 0;
      noBtn.style.pointerEvents = 'none';
    }
  }

  function sayYes() {
    currentSpread = SPREADS.length - 1;
    renderBook('next');
    if (!voicePlaying) {
      setTimeout(() => {
        voiceAudio.volume = 0.4;
        voiceAudio.play().then(() => {
          voicePlaying = true;
          updateVoiceButtons();
          document.getElementById('musicBadge').classList.add('show');
        }).catch(() => {});
      }, 1200);
    }
  }

      "Subhashree ji, kshama kijiye. Maine bahut galtiyan ki hain. " +
      "Aapka swasthya theek nahi hai, kripya apna poora khayal rakhiye. " +
      "Samay par bhojan kijiye aur aaram kijiye. Main sadaiv aapke saath hoon. " +
      "Kripya ek baar muskura dijiye... Kshama, hriday se kshama.";
    const url = 'https://wa.me/' + MY_NUMBER + '?text=' + encodeURIComponent(message);
    window.open(url, '_blank');
  }
