<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Subhashree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif;
    background: #0a0a1a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    color: #fff;
    padding: 20px 14px;
    position: relative;
  }

  /* ================================================
     LOVE THEME BACKGROUND — soft rose + violet
     ================================================ */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 15% 5%, rgba(244, 63, 94, 0.4) 0%, transparent 55%),
      radial-gradient(ellipse 70% 55% at 90% 20%, rgba(236, 72, 153, 0.35) 0%, transparent 55%),
      radial-gradient(ellipse 75% 60% at 50% 100%, rgba(168, 85, 247, 0.35) 0%, transparent 55%),
      radial-gradient(ellipse 60% 50% at 0% 100%, rgba(251, 113, 133, 0.25) 0%, transparent 55%),
      linear-gradient(160deg, #1a0410 0%, #2a0724 50%, #14031a 100%);
    animation: bgShift 22s ease-in-out infinite;
  }
  @keyframes bgShift {
    0%, 100% { filter: hue-rotate(0deg); }
    50%      { filter: hue-rotate(15deg); }
  }

  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    opacity: 0.15;
    mix-blend-mode: overlay;
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.45;
    z-index: 1;
    animation: orbFloat 20s ease-in-out infinite;
    pointer-events: none;
  }
  .orb.o1 { width: 340px; height: 340px; background: #f43f5e; top: 2%; left: -10%; }
  .orb.o2 { width: 300px; height: 300px; background: #ec4899; bottom: 5%; right: -8%; animation-delay: -7s; }
  .orb.o3 { width: 260px; height: 260px; background: #a855f7; top: 55%; left: 45%; animation-delay: -14s; opacity: 0.3; }
  .orb.o4 { width: 220px; height: 220px; background: #fb7185; top: 20%; right: 25%; animation-delay: -4s; opacity: 0.25; }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(45px, -35px) scale(1.12); }
    66%      { transform: translate(-35px, 35px) scale(0.92); }
  }

  .star {
    position: fixed;
    width: 1.5px; height: 1.5px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 4s infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; }
    50%      { opacity: 0.9; box-shadow: 0 0 6px #fff; }
  }

  /* Floating hearts (soft, love theme) */
  .float-heart {
    position: fixed;
    width: 14px; height: 14px;
    background: linear-gradient(135deg, #f43f5e, #ec4899);
    transform: rotate(-45deg);
    animation: floatUp linear infinite;
    pointer-events: none;
    opacity: 0;
    z-index: 2;
    border-radius: 2px;
  }
  .float-heart::before,
  .float-heart::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    background: inherit;
    border-radius: 50%;
  }
  .float-heart::before { top: -7px; left: 0; }
  .float-heart::after  { top: 0; left: 7px; }
  @keyframes floatUp {
    0%   { transform: translateY(100vh) rotate(-45deg) scale(0.3); opacity: 0; }
    15%  { opacity: 0.55; }
    100% { transform: translateY(-120px) rotate(-45deg) scale(1.1); opacity: 0; }
  }

  /* ================================================
     SCREEN SYSTEM
     ================================================ */
  .screen {
    display: none;
    width: 100%;
    max-width: 720px;
    z-index: 10;
    position: relative;
  }
  .screen.active { display: block; animation: screenIn 0.85s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(22px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ================================================
     GLASS CARD — love theme
     ================================================ */
  .glass {
    position: relative;
    background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255, 200, 220, 0.18);
    border-radius: 30px;
    padding: 48px 40px;
    box-shadow:
      0 30px 80px -20px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(255, 255, 255, 0.05) inset,
      0 1px 0 rgba(255, 255, 255, 0.15) inset,
      0 0 100px -30px rgba(244, 63, 94, 0.5);
    overflow: hidden;
  }
  .glass::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 200, 220, 0.6), transparent);
  }

  /* ================================================
     LOGIN
     ================================================ */
  .login-card { text-align: center; }

  .heart-lock {
    width: 86px; height: 86px;
    margin: 0 auto 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(244, 63, 94, 0.3), rgba(236, 72, 153, 0.2));
    border: 1px solid rgba(255, 200, 220, 0.25);
    box-shadow:
      0 0 50px -10px rgba(244, 63, 94, 0.7),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    animation: heartLockPulse 2.8s ease-in-out infinite;
  }
  @keyframes heartLockPulse {
    0%, 100% { box-shadow: 0 0 50px -10px rgba(244, 63, 94, 0.7), inset 0 1px 0 rgba(255,255,255,0.25); transform: scale(1); }
    50%      { box-shadow: 0 0 70px -5px rgba(236, 72, 153, 0.8), inset 0 1px 0 rgba(255,255,255,0.3); transform: scale(1.04); }
  }

  /* Heart SVG */
  .heart-svg { width: 40px; height: 40px; animation: heartbeat 1.4s ease-in-out infinite; }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25%      { transform: scale(1.15); }
    50%      { transform: scale(1); }
    75%      { transform: scale(1.1); }
  }

  .login-title {
    font-size: 1.85em;
    font-weight: 700;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #ffffff 0%, #fecdd3 50%, #f9a8d4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  .login-sub {
    font-size: 0.95em;
    color: rgba(255, 220, 230, 0.7);
    margin-bottom: 32px;
    line-height: 1.7;
    font-weight: 400;
  }

  .pin-input {
    width: 100%;
    padding: 18px 20px;
    font-size: 1.5em;
    text-align: center;
    letter-spacing: 14px;
    border-radius: 16px;
    border: 1px solid rgba(255, 200, 220, 0.2);
    background: rgba(0, 0, 0, 0.3);
    color: #fff;
    font-family: 'SF Mono', 'Courier New', monospace;
    outline: none;
    transition: all 0.3s;
    font-weight: 600;
  }
  .pin-input:focus {
    border-color: rgba(244, 63, 94, 0.7);
    background: rgba(0, 0, 0, 0.4);
    box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.15), 0 0 30px -5px rgba(244, 63, 94, 0.6);
  }
  .pin-input::placeholder {
    color: rgba(255, 200, 220, 0.3);
    letter-spacing: 4px;
    font-size: 0.65em;
    font-weight: 400;
  }

  .hint {
    font-size: 0.82em;
    color: rgba(255, 200, 220, 0.5);
    margin-top: 14px;
    font-weight: 400;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: none;
    border-radius: 16px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    letter-spacing: 0.3px;
    font-size: 0.98em;
  }

  .btn-primary {
    margin-top: 26px;
    width: 100%;
    padding: 17px;
    background: linear-gradient(135deg, #f43f5e 0%, #ec4899 50%, #a855f7 100%);
    color: #fff;
    box-shadow:
      0 10px 30px -10px rgba(244, 63, 94, 0.7),
      0 0 0 1px rgba(255,255,255,0.1) inset,
      0 1px 0 rgba(255,255,255,0.25) inset;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow:
      0 16px 40px -10px rgba(236, 72, 153, 0.85),
      0 0 0 1px rgba(255,255,255,0.15) inset,
      0 1px 0 rgba(255,255,255,0.3) inset;
  }
  .btn-primary:active { transform: translateY(0); }

  .error {
    color: #fda4af;
    font-size: 0.85em;
    margin-top: 14px;
    min-height: 20px;
    opacity: 0;
    transition: opacity 0.3s;
    font-weight: 500;
  }
  .error.show { opacity: 1; }

  .shake { animation: shakeCard 0.5s ease; }
  @keyframes shakeCard {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  /* ================================================
     READING CARD
     ================================================ */
  .chapter-card {
    padding: 52px 46px;
    min-height: 520px;
    display: flex;
    flex-direction: column;
  }

  .chapter-head {
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255, 200, 220, 0.1);
  }

  .chapter-label {
    display: inline-block;
    font-size: 0.72em;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(251, 113, 133, 0.95);
    font-weight: 600;
    margin-bottom: 10px;
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(244, 63, 94, 0.12);
    border: 1px solid rgba(244, 63, 94, 0.25);
  }

  .chapter-title {
    font-size: 1.85em;
    font-weight: 700;
    background: linear-gradient(135deg, #ffffff 0%, #fecdd3 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
    line-height: 1.25;
    margin-bottom: 6px;
  }

  .chapter-date {
    font-size: 0.85em;
    color: rgba(255, 200, 220, 0.45);
    font-weight: 400;
    font-style: italic;
  }

  .chapter-body {
    flex: 1;
    color: rgba(255, 235, 240, 0.9);
    font-size: 1.05em;
    line-height: 1.9;
    font-weight: 400;
  }

  .chapter-body p { margin-bottom: 16px; }

  .chapter-body .drop-cap::first-letter {
    font-size: 3.2em;
    float: left;
    line-height: 0.9;
    padding: 6px 12px 0 0;
    font-weight: 700;
    background: linear-gradient(135deg, #f43f5e, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .chapter-body .hl {
    color: #fda4af;
    font-weight: 600;
  }

  .signature {
    margin-top: auto;
    padding-top: 24px;
    font-size: 0.92em;
    color: rgba(255, 200, 220, 0.55);
    font-style: italic;
    text-align: right;
    border-top: 1px solid rgba(255, 200, 220, 0.08);
  }

  /* ================================================
     IN-PAGE BUTTONS
     ================================================ */
  .btn-soft {
    padding: 13px 24px;
    border-radius: 14px;
    background: rgba(255, 200, 220, 0.08);
    border: 1px solid rgba(255, 200, 220, 0.15);
    color: #fff;
    font-size: 0.93em;
    backdrop-filter: blur(10px);
    margin-top: 14px;
    align-self: flex-start;
  }
  .btn-soft:hover {
    background: rgba(255, 200, 220, 0.15);
    border-color: rgba(255, 200, 220, 0.25);
    transform: translateY(-2px);
  }

  .btn-accent {
    padding: 13px 26px;
    border-radius: 14px;
    background: linear-gradient(135deg, #f43f5e 0%, #ec4899 100%);
    color: #fff;
    font-size: 0.93em;
    margin-top: 14px;
    align-self: flex-start;
    box-shadow:
      0 8px 24px -8px rgba(244, 63, 94, 0.7),
      0 1px 0 rgba(255,255,255,0.2) inset;
  }
  .btn-accent:hover {
    transform: translateY(-2px);
    box-shadow:
      0 12px 32px -8px rgba(236, 72, 153, 0.85),
      0 1px 0 rgba(255,255,255,0.25) inset;
  }

  .btn-icon { width: 17px; height: 17px; fill: currentColor; flex-shrink: 0; }

  .joke-box {
    padding: 20px 22px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(244, 63, 94, 0.12), rgba(236, 72, 153, 0.06));
    border: 1px solid rgba(244, 63, 94, 0.25);
    color: rgba(255, 235, 240, 0.95);
    font-size: 1em;
    line-height: 1.75;
    margin: 8px 0 14px;
    min-height: 90px;
    display: flex;
    align-items: center;
    transition: opacity 0.3s;
    font-style: italic;
  }

  /* ================================================
     QUESTION
     ================================================ */
  .question-text {
    font-size: 1.3em;
    font-weight: 500;
    text-align: center;
    margin: 26px 0 34px;
    color: rgba(255, 235, 240, 0.95);
    line-height: 1.5;
    letter-spacing: -0.3px;
  }

  .qa-row {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    min-height: 70px;
    position: relative;
  }

  .qa-btn {
    padding: 15px 38px;
    border-radius: 16px;
    font-family: inherit;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    border: none;
    letter-spacing: 0.3px;
  }

  .qa-yes {
    background: linear-gradient(135deg, #f43f5e 0%, #ec4899 100%);
    color: #fff;
    box-shadow:
      0 12px 30px -10px rgba(244, 63, 94, 0.7),
      0 1px 0 rgba(255,255,255,0.2) inset;
  }
  .qa-yes:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 18px 40px -10px rgba(236, 72, 153, 0.9);
  }

  .qa-no {
    background: rgba(255, 200, 220, 0.08);
    color: rgba(255, 220, 230, 0.9);
    border: 1px solid rgba(255, 200, 220, 0.18);
  }
  .qa-no:hover { background: rgba(255, 200, 220, 0.14); }

  .no-hint {
    font-size: 0.9em;
    color: rgba(253, 164, 175, 0.95);
    text-align: center;
    margin-top: 18px;
    min-height: 22px;
    opacity: 0;
    transition: opacity 0.4s;
    font-style: italic;
  }

  /* ================================================
     FINAL SCREEN
     ================================================ */
  .final-heart {
    width: 66px; height: 66px;
    background: linear-gradient(135deg, #f43f5e, #ec4899);
    transform: rotate(-45deg);
    position: relative;
    margin: 8px auto 38px;
    animation: heartbeat 1.4s ease-in-out infinite;
    box-shadow: 0 0 60px rgba(244, 63, 94, 0.75);
  }
  .final-heart::before, .final-heart::after {
    content: '';
    position: absolute;
    width: 66px; height: 66px;
    background: inherit;
    border-radius: 50%;
  }
  .final-heart::before { top: -33px; left: 0; }
  .final-heart::after  { top: 0; left: 33px; }

  .final-title {
    font-size: 1.95em;
    font-weight: 700;
    text-align: center;
    margin-bottom: 18px;
    background: linear-gradient(135deg, #ffffff 0%, #fecdd3 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  .final-text {
    font-size: 1em;
    color: rgba(255, 220, 230, 0.8);
    line-height: 1.9;
    text-align: center;
    margin-bottom: 20px;
  }

  /* ================================================
     NAVIGATION
     ================================================ */
  .nav-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 22px;
    flex-wrap: wrap;
  }

  .nav-btn {
    padding: 14px 28px;
    border-radius: 14px;
    font-family: inherit;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    border: none;
    letter-spacing: 0.3px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }

  .nav-prev {
    background: rgba(255, 200, 220, 0.07);
    color: rgba(255, 220, 230, 0.9);
    border: 1px solid rgba(255, 200, 220, 0.15);
    backdrop-filter: blur(10px);
  }
  .nav-prev:hover {
    background: rgba(255, 200, 220, 0.12);
    border-color: rgba(255, 200, 220, 0.25);
    transform: translateY(-2px);
  }

  .nav-next {
    background: linear-gradient(135deg, #f43f5e 0%, #ec4899 100%);
    color: #fff;
    box-shadow:
      0 10px 28px -10px rgba(244, 63, 94, 0.7),
      0 1px 0 rgba(255,255,255,0.2) inset;
  }
  .nav-next:hover {
    transform: translateY(-2px);
    box-shadow:
      0 16px 36px -10px rgba(236, 72, 153, 0.9),
      0 1px 0 rgba(255,255,255,0.25) inset;
  }

  .nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none !important;
  }

  /* ================================================
     PROGRESS DOTS
     ================================================ */
  .dots {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 22px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255, 200, 220, 0.2);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
  }
  .dot.active {
    background: linear-gradient(135deg, #f43f5e, #ec4899);
    width: 26px;
    border-radius: 4px;
    box-shadow: 0 0 14px rgba(244, 63, 94, 0.7);
  }

  /* ================================================
     MUSIC BADGE
     ================================================ */
  .music-badge {
    position: fixed;
    top: 18px;
    right: 18px;
    background: rgba(255, 200, 220, 0.08);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 200, 220, 0.2);
    border-radius: 40px;
    padding: 9px 18px;
    font-size: 0.82em;
    color: rgba(255, 220, 230, 0.9);
    z-index: 100;
    display: none;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    font-weight: 500;
  }
  .music-badge.show { display: flex; animation: screenIn 0.5s ease; }

  .music-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
  }
  .music-bars span {
    width: 3px;
    background: linear-gradient(180deg, #f43f5e, #ec4899);
    border-radius: 2px;
    animation: barPulse 0.9s ease-in-out infinite;
  }
  .music-bars span:nth-child(1) { animation-delay: 0s; height: 6px; }
  .music-bars span:nth-child(2) { animation-delay: 0.15s; height: 10px; }
  .music-bars span:nth-child(3) { animation-delay: 0.3s; height: 8px; }
  .music-bars span:nth-child(4) { animation-delay: 0.45s; height: 12px; }
  @keyframes barPulse {
    0%, 100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1); }
  }

  /* ================================================
     RESPONSIVE
     ================================================ */
  @media (max-width: 640px) {
    body { padding: 14px 10px; }
    .glass { padding: 36px 26px; border-radius: 26px; }
    .chapter-card { padding: 38px 26px; min-height: 480px; }
    .login-title { font-size: 1.5em; }
    .chapter-title { font-size: 1.5em; }
    .chapter-body { font-size: 0.98em; line-height: 1.85; }
    .chapter-body .drop-cap::first-letter { font-size: 2.6em; padding: 4px 8px 0 0; }
    .heart-lock { width: 74px; height: 74px; margin-bottom: 20px; }
    .heart-svg { width: 34px; height: 34px; }
    .question-text { font-size: 1.15em; margin: 20px 0 26px; }
    .qa-btn { padding: 13px 28px; font-size: 0.95em; }
    .nav-btn { padding: 12px 20px; font-size: 0.88em; }
    .final-title { font-size: 1.55em; }
    .final-heart { width: 54px; height: 54px; }
    .final-heart::before, .final-heart::after { width: 54px; height: 54px; }
    .final-heart::before { top: -27px; }
    .final-heart::after { left: 27px; }
    .music-badge { top: 10px; right: 10px; padding: 7px 13px; font-size: 0.72em; }
  }

  @media (max-width: 400px) {
    .glass { padding: 30px 20px; }
    .chapter-card { padding: 30px 20px; }
    .chapter-body { font-size: 0.94em; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
<div class="orb o4"></div>

<div class="music-badge" id="musicBadge">
  <div class="music-bars"><span></span><span></span><span></span><span></span></div>
  <span>Playing</span>
</div>

<!-- ============ SCREEN 1: LOGIN ============ -->
<div class="screen active" id="screenLogin">
  <div class="glass login-card" id="loginCard">
    <div class="heart-lock">
      <svg class="heart-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21s-7-4.35-9.33-8.5C.9 9.5 2.5 6 5.5 5.2c2-.5 3.7.5 4.5 2 .8-1.5 2.5-2.5 4.5-2 3 .8 4.6 4.3 2.83 7.3C19 16.65 12 21 12 21z" fill="url(#heartGrad)"/>
        <defs>
          <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fda4af"/>
            <stop offset="50%" stop-color="#f43f5e"/>
            <stop offset="100%" stop-color="#ec4899"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <h1 class="login-title">Ek Baat Kehni Hai</h1>
    <p class="login-sub">Subhashree, yeh sirf aapke liye hai.<br>Kholne ke liye apna code daaliye.</p>
    <input type="password" inputmode="numeric" maxlength="6" class="pin-input" id="pinInput" placeholder="CODE" autocomplete="off">
    <p class="hint">Hint: aapki pasandeeda tareekh (digit mein)</p>
    <button class="btn btn-primary" onclick="checkPin()">Kholiye</button>
    <p class="error" id="errorMsg">Yeh code sahi nahi hai. Kripya phir se try kijiye.</p>
  </div>
</div>

<!-- ============ SCREEN 2: READING ============ -->
<div class="screen" id="screenRead">
  <div class="glass chapter-card" id="chapterCard">
    <div class="chapter-head">
      <span class="chapter-label" id="chapterLabel">Part 01</span>
      <h2 class="chapter-title" id="chapterTitle"></h2>
      <p class="chapter-date" id="chapterDate"></p>
    </div>
    <div class="chapter-body" id="chapterBody"></div>
  </div>

  <div class="dots" id="dotsRow"></div>

  <div class="nav-row">
    <button class="nav-btn nav-prev" id="prevBtn" onclick="prevPage()">
      <svg class="btn-icon" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7z"/></svg>
      Peeche
    </button>
    <button class="nav-btn nav-next" id="nextBtn" onclick="nextPage()">
      Aage
      <svg class="btn-icon" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7z"/></svg>
    </button>
  </div>
</div>

<!-- ============ AUDIO — apna song.mp3 ============ -->
<audio id="voiceAudio" preload="auto" loop>
  <source src="song.mp3" type="audio/mpeg">
  <!-- Fallback agar song.mp3 na mile toh -->
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3" type="audio/mpeg">
</audio>

<script>
  /* ===== Stars ===== */
  for (let i = 0; i < 55; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = Math.random() * 4 + 's';
    s.style.animationDuration = (3 + Math.random() * 3) + 's';
    document.body.appendChild(s);
  }

  /* ===== Floating hearts ===== */
  setInterval(() => {
    const h = document.createElement('div');
    h.className = 'float-heart';
    const size = 10 + Math.random() * 12;
    h.style.width = size + 'px';
    h.style.height = size + 'px';
    h.querySelectorAll;
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDuration = (9 + Math.random() * 6) + 's';
    const colors = [
      'linear-gradient(135deg, #f43f5e, #ec4899)',
      'linear-gradient(135deg, #fb7185, #f472b6)',
      'linear-gradient(135deg, #ec4899, #a855f7)',
      'linear-gradient(135deg, #fda4af, #f43f5e)'
    ];
    h.style.background = colors[Math.floor(Math.random() * colors.length)];
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 16000);
  }, 900);

  function goTo(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ============================================================
     PIN + SONG AUTOPLAY (login ke baad)
     ============================================================ */
  const VALID_CODES = ['02', '2', '0206', '02062025', '062'];
  const voiceAudio = document.getElementById('voiceAudio');
  let voicePlaying = false;

  function checkPin() {
    const input = document.getElementById('pinInput').value.trim();
    const card = document.getElementById('loginCard');
    const error = document.getElementById('errorMsg');

    if (VALID_CODES.includes(input)) {
      error.classList.remove('show');
      goTo('screenRead');
      renderPage();
      setTimeout(() => {
        voiceAudio.volume = 0.45;
        voiceAudio.play().then(() => {
          voicePlaying = true;
          document.getElementById('musicBadge').classList.add('show');
        }).catch(() => {
          voicePlaying = false;
        });
      }, 600);
    } else {
      card.classList.add('shake');
      error.classList.add('show');
      setTimeout(() => card.classList.remove('shake'), 500);
      document.getElementById('pinInput').value = '';
    }
  }
  document.getElementById('pinInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') checkPin();
  });
  document.getElementById('pinInput').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
  });

  /* ============================================================
     PAGES — respectful + gen-z vibe + love theme
     ============================================================ */
  const PAGES = [
    {
      title: "Ek Baat Kehni Hai...",
      date: "shuruwat yahin se",
      label: "Part 01",
      html: `
        <p class="drop-cap">Subhashree, I know aap gussa hain. Aur honestly? Aap gussa hone ki haqdaar bhi hain. Main jaanta hoon maine kuch aisa kiya jo aapne deserve nahi kiya.</p>
        <p>Toh yeh sab likh raha hoon. Not to force you, not to convince you. Bas&hellip; dil halka karna tha.</p>
        <p>Aur ek chhoti si request &mdash; yeh padhna shuru kijiye, aur agar beech mein smile aaye toh mujhe mat batana. Main khud samajh jaunga.</p>
        <div class="signature">&mdash; Aapka, hamesha</div>
      `
    },
    {
      title: "Sorry, Dil Se",
      date: "no filters, no excuses",
      label: "Part 02",
      html: `
        <p>I messed up. Simple. Maine aapko rulaya, maine aapko akela feel karaya. Aur woh sab &mdash; <span class="hl">poora mera fault tha.</span></p>
        <p>Main yeh nahi bolunga ki "galti ho gayi" ya "I didn't mean it". Agar mean nahi karta toh karta hi nahi na?</p>
        <p>Toh sorry. Real sorry. Woh sorry jo bas formality na ho.</p>
        <p>Aur ek baat &mdash; main bhaagne wala banda nahi hoon. Galti kari hai, toh fix bhi karunga.</p>
      `
    },
    {
      title: "Yeh Suno Zaroor",
      date: "text se better hai na",
      label: "Part 03",
      html: `
        <p>Kuch cheezein likh ke nahi keh paata. Toh ek chhota sa message hai&hellip;</p>
        <p>Suniye zaroor. Ek baar. Please.</p>
        <button class="btn btn-soft" onclick="toggleVoice()" id="voiceBtnLeft" style="margin-top:20px;">
          <svg class="btn-icon" viewBox="0 0 24 24" id="voiceIconLeft">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <span id="voiceLabelLeft">Play Kijiye</span>
        </button>
        <p style="margin-top:22px; font-style:italic; color:#fda4af;">&ldquo;Main aapko akela nahi chhodunga. Promise. Cross my heart.&rdquo;</p>
      `
    },
        {
      title: "Meri Galtiyan",
      date: "list bana di, kyunki list clear hoti hai",
      label: "Part 04",
      html: `
        <p class="drop-cap">Sabse pehle &mdash; meri overthinking. Woh har cheez ko itna bada bana deti thi jitni woh actually thi hi nahi. Aur main usi overthinking ke chakkar mein aapko spam messages bhejta raha. Ek ke baad ek, bina rukey.</p>
        <p>Aap ne shayad kaha bhi hoga "bas karo", par main ruka nahi. Aur woh <span class="hl">galat tha</span>. Poora galat.</p>
        <p>Aur sabse bura &mdash; usi overthinking ke chakkar mein maine bohot kuch bol diya jo bolna nahi chahiye tha. Woh baatein jo aapko hurt karengi, jo aapko rulayengi. Maine socha hi nahi ki aap kya feel karogi.</p>
        <p>Main jaanta hoon yeh sab keh kar ab kuch undo nahi hota. Par main sirf itna kehna chahta hoon &mdash; <span class="hl">mujhe pata hai main galat tha</span>. Aur main ise theek karna chahta hoon.</p>
        <p>Overthinking mera problem hai, aapka nahi. Main ispe kaam karunga. Aur aapko spam karne ki jagah, main aapki baat sununga. Shanti se. Bina react kiye.</p>
        <p>Sorry. Yeh sab ke liye. Dil se.</p>
      `
    },
    {
      title: "Ab Thoda Smile Kijiye",
      date: "kyunki aapki smile > everything",
      label: "Part 05",
      html: `
        <p>Okay ab thoda chill kijiye. Neeche button dabate rahiye, har baar naya joke aayega. Guarantee nahi hai ki hasenge, but try toh kar sakte hain na.</p>
        <div class="joke-box" id="jokeBox">Button dabaiye, joke aayega. Simple.</div>
        <button class="btn btn-accent" onclick="nextJoke()">
          <svg class="btn-icon" viewBox="0 0 24 24">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-4 7a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0zm8 0a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0zm-8.5 5.5h9a.75.75 0 0 1 0 1.5h-9a.75.75 0 0 1 0-1.5z"/>
          </svg>
          Ek Aur
        </button>
      `
    },
    {
      title: "Aapke Baare Mein",
      date: "jo maine kabhi bola nahi",
      label: "Part 06",
      html: `
        <p>Jab aap hansti hain na, toh lagta hai duniya ruk gayi. Literally.</p>
        <p>Aap gussa hoti hain toh bhi cute hain. But woh gussa mujhe andar se tod deta hai, aap jaanti hain?</p>
        <p>Aap jab "hmm" bolti hain, main us ek word mein poori kahani padh leta hoon.</p>
        <p>Aap meri life ka woh part hain jo main <span class="hl">kabhi lose nahi karna chahta.</span> Ever.</p>
      `
    },
    {
      title: "Ek Chhota Sa Sawal",
      date: "bas haan ya na",
      label: "Part 07",
      html: `
        <p class="question-text" id="questionText">Kya aap mujhe maaf kar sakti hain?</p>
        <div class="qa-row" id="qaRow">
          <button class="qa-btn qa-yes" id="yesBtn" onclick="sayYes()">Haan</button>
          <button class="qa-btn qa-no" id="noBtn" onclick="sayNo()">Nahi</button>
        </div>
        <p class="no-hint" id="noHint"></p>
      `
    },
    {
      title: "Ek Promise",
      date: "likh ke de raha hoon",
      label: "Part 08",
      html: `
        <p>Okay here's my promise&hellip;</p>
        <p>1. Aapki baat dhyan se sununga, bina interrupt kiye.</p>
        <p>2. Aapka khayal rakhunga &mdash; khana, aaram, health, sab.</p>
        <p>3. Aapko kabhi akela feel nahi karne dunga.</p>
        <p>4. Aur jab aap gussa hongi, main joke sunaunga &mdash; jab tak aap has na dein.</p>
        <p style="font-style:italic; color:#fda4af;">Yeh promise hai. Toota toh&hellip; aap bata dijiye, main sudhar jaunga.</p>
      `
    },
    {
      title: "Thank You",
      date: "dil se",
      label: "Part 09",
      html: `
        <p>Yeh sab yahan khatam ho raha hai&hellip; but humari story nahi.</p>
        <p>Aap meri life mein hain, yeh meri sabse badi khushi hai. Aur main isse kabhi lose nahi karna chahta.</p>
        <p>Please apna khayal rakhiye. Time pe khana, aaram karna. <span class="hl">Aapki health sabse pehle hai.</span></p>
        <div class="signature">&mdash; Aapka, hamesha</div>
      `
    },
    {
      title: "Sorry, Subhashree",
      date: "last page, but not the end",
      label: "Part 10",
      html: `
        <div class="final-heart"></div>
        <p class="final-text">
          Agar aap yahan tak padh aayi hain, toh&hellip;<br>
          matlab aapne mujhe ek chance diya hai.<br><br>
          Bas apna khayal rakhiye. Aap theek rahe &mdash; bas itni si meri wish hai.
        </p>
      `
    }
  ];

  let currentPage = 0;

  const dotsRow = document.getElementById('dotsRow');
  PAGES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => { currentPage = i; renderPage(); };
    dotsRow.appendChild(d);
  });

  function renderPage() {
    const p = PAGES[currentPage];
    document.getElementById('chapterLabel').textContent = p.label;
    document.getElementById('chapterTitle').textContent = p.title;
    document.getElementById('chapterDate').textContent = p.date;
    document.getElementById('chapterBody').innerHTML = p.html;

    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage === PAGES.length - 1;

    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === currentPage);
    });

    updateVoiceButtons();
  }

  function nextPage() {
    if (currentPage < PAGES.length - 1) {
      currentPage++;
      renderPage();
    }
  }
  function prevPage() {
    if (currentPage > 0) {
      currentPage--;
      renderPage();
    }
  }

  function updateVoiceButtons() {
    const l1 = document.getElementById('voiceLabelLeft');
    const i1 = document.getElementById('voiceIconLeft');
    if (!l1) return;
    if (voicePlaying) {
      l1.textContent = 'Rukiye...';
      if (i1) i1.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    } else {
      l1.textContent = 'Play Kijiye';
      if (i1) i1.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
  }

  function toggleVoice() {
    if (voicePlaying) {
      voiceAudio.pause();
      voiceAudio.currentTime = 0;
      voicePlaying = false;
      updateVoiceButtons();
      document.getElementById('musicBadge').classList.remove('show');
    } else {
      voiceAudio.volume = 0.45;
      voiceAudio.play().then(() => {
        voicePlaying = true;
        updateVoiceButtons();
        document.getElementById('musicBadge').classList.add('show');
      }).catch(() => {
        const l1 = document.getElementById('voiceLabelLeft');
        if (l1) l1.textContent = 'Phir se dabaiye';
      });
    }
  }

  /* ===== Jokes — respectful + light ===== */
  const jokes = [
    "Maine gym kyun chhoda? Kyunki aapke saamne toh main pehle se hi weak hoon. Dil se. Literally.",
    "Doctor ne bola rest karo. Maine bola — pehle Subhashree ka gussa theek ho jaye, phir sochunga.",
    "Meri battery 1% pe aati hai toh charger dhoondhta hoon. Aapki smile 1% pe aati hai toh main duniya bhool jaata hoon. Weird flex but okay.",
    "Aapke bina main aisa hoon jaise WiFi bina phone — connected dikhta hoon, but kaam nahi karta.",
    "Google se pucha — 'sabse pyaari ladki kaun?' Google bola — 'bhai tu already jaanta hai, jaake sorry maang le.'",
    "Aap gussa hoti hain toh bhi cute lagti hain. But aap hansti hain toh samay ruk jaata hai. Please, thoda muskura dijiye.",
    "Mera favourite time? Jab aap 'sorry' ke baad 'chalega' bolti hain. That's the moment, fr.",
    "Life mein do cheezein important hain — chai aur aapki smile. Chai mil jaati hai, smile ke liye maafi maang raha hoon."
  ];
  let jokeIndex = 0;

  function nextJoke() {
    const jokeBox = document.getElementById('jokeBox');
    if (!jokeBox) return;
    jokeBox.style.opacity = 0;
    setTimeout(() => {
      jokeBox.innerHTML = jokes[jokeIndex % jokes.length];
      jokeBox.style.opacity = 1;
      jokeIndex++;
    }, 180);
  }

  let noCount = 0;
  const noResponses = [
    "Nahi dabaya? Okay okay, main wait karunga.",
    "Ab bhi nahi? Dekhiye, teddy bhi udaas ho raha hai.",
    "Chaliye ek aur chance dijiye... please?",
    "Aapki smile toh 'haan' bol rahi hai. Bas ek click.",
    "Theek hai, main wait karunga. But 'Nahi' button dheere dheere bhaag raha hai, dekha?",
    "Last baar puch raha hoon... please?"
  ];

  function sayNo() {
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const noHint = document.getElementById('noHint');
    if (!noBtn) return;

    noCount++;
    const x = (Math.random() - 0.5) * 150;
    const y = (Math.random() - 0.5) * 50;
    noBtn.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
    noBtn.style.fontSize = Math.max(0.7, 1 - noCount * 0.06) + 'em';

    if (yesBtn) yesBtn.style.transform = 'scale(' + Math.min(1.5, 1 + noCount * 0.1) + ')';

    if (noCount <= noResponses.length && noHint) {
      noHint.textContent = noResponses[noCount - 1];
      noHint.style.opacity = 1;
    }
    if (noCount >= 6) {
      noBtn.style.opacity = 0;
      noBtn.style.pointerEvents = 'none';
    }
  }

  function sayYes() {
    currentPage = PAGES.length - 1;
    renderPage();
    if (!voicePlaying) {
      setTimeout(() => {
        voiceAudio.volume = 0.45;
        voiceAudio.play().then(() => {
          voicePlaying = true;
          updateVoiceButtons();
          document.getElementById('musicBadge').classList.add('show');
        }).catch(() => {});
      }, 800);
    }
  }
</script>

</body>
</html>
