<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kshama - Subhashree Ji</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif;
    background: #0a0a1a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    color: #fff;
    padding: 20px 14px;
    position: relative;
  }

  /* ================================================
     PREMIUM GRADIENT BACKGROUND
     ================================================ */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(139, 92, 246, 0.35) 0%, transparent 55%),
      radial-gradient(ellipse 70% 55% at 85% 15%, rgba(236, 72, 153, 0.28) 0%, transparent 55%),
      radial-gradient(ellipse 75% 60% at 50% 100%, rgba(99, 102, 241, 0.3) 0%, transparent 55%),
      radial-gradient(ellipse 60% 50% at 100% 100%, rgba(244, 114, 182, 0.2) 0%, transparent 55%),
      linear-gradient(160deg, #0a0a1a 0%, #15072a 50%, #0a0415 100%);
    animation: bgShift 20s ease-in-out infinite;
  }
  @keyframes bgShift {
    0%, 100% { filter: hue-rotate(0deg); }
    50%      { filter: hue-rotate(20deg); }
  }

  /* Subtle noise / grain */
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    opacity: 0.15;
    mix-blend-mode: overlay;
  }

  /* Floating orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.4;
    z-index: 1;
    animation: orbFloat 18s ease-in-out infinite;
    pointer-events: none;
  }
  .orb.o1 { width: 320px; height: 320px; background: #a855f7; top: 5%; left: -8%; }
  .orb.o2 { width: 280px; height: 280px; background: #ec4899; bottom: 8%; right: -6%; animation-delay: -6s; }
  .orb.o3 { width: 240px; height: 240px; background: #6366f1; top: 55%; left: 45%; animation-delay: -12s; opacity: 0.25; }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(40px, -30px) scale(1.1); }
    66%      { transform: translate(-30px, 30px) scale(0.95); }
  }

  /* Stars */
  .star {
    position: fixed;
    width: 1.5px; height: 1.5px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 4s infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; }
    50%      { opacity: 0.9; box-shadow: 0 0 6px #fff; }
  }

  /* ================================================
     SCREEN SYSTEM
     ================================================ */
  .screen {
    display: none;
    width: 100%;
    max-width: 720px;
    z-index: 10;
    position: relative;
  }
  .screen.active { display: block; animation: screenIn 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ================================================
     PREMIUM GLASS CARD
     ================================================ */
  .glass {
    position: relative;
    background: linear-gradient(135deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 28px;
    padding: 48px 40px;
    box-shadow:
      0 30px 80px -20px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(255, 255, 255, 0.05) inset,
      0 1px 0 rgba(255, 255, 255, 0.15) inset,
      0 0 80px -30px rgba(168, 85, 247, 0.4);
    overflow: hidden;
  }
  /* Top shine line */
  .glass::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  }

  /* ================================================
     LOGIN
     ================================================ */
  .login-card {
    text-align: center;
  }

  .lock-wrap {
    width: 82px; height: 82px;
    margin: 0 auto 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.25), rgba(236, 72, 153, 0.15));
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow:
      0 0 40px -10px rgba(168, 85, 247, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    animation: lockPulse 3s ease-in-out infinite;
  }
  @keyframes lockPulse {
    0%, 100% { box-shadow: 0 0 40px -10px rgba(168, 85, 247, 0.6), inset 0 1px 0 rgba(255,255,255,0.2); }
    50%      { box-shadow: 0 0 60px -5px rgba(236, 72, 153, 0.7), inset 0 1px 0 rgba(255,255,255,0.25); }
  }
  .lock-svg { width: 38px; height: 38px; }

  .login-title {
    font-size: 1.8em;
    font-weight: 700;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #ffffff 0%, #e9d5ff 50%, #fbcfe8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  .login-sub {
    font-size: 0.95em;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 32px;
    line-height: 1.7;
    font-weight: 400;
  }

  .pin-input {
    width: 100%;
    padding: 18px 20px;
    font-size: 1.5em;
    text-align: center;
    letter-spacing: 14px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(0, 0, 0, 0.25);
    color: #fff;
    font-family: 'SF Mono', 'Courier New', monospace;
    outline: none;
    transition: all 0.3s;
    font-weight: 600;
  }
  .pin-input:focus {
    border-color: rgba(168, 85, 247, 0.6);
    background: rgba(0, 0, 0, 0.35);
    box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.12), 0 0 30px -5px rgba(168, 85, 247, 0.5);
  }
  .pin-input::placeholder {
    color: rgba(255, 255, 255, 0.25);
    letter-spacing: 4px;
    font-size: 0.65em;
    font-weight: 400;
  }

  .hint {
    font-size: 0.82em;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 14px;
    font-weight: 400;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: none;
    border-radius: 16px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    letter-spacing: 0.3px;
    font-size: 0.98em;
  }

  .btn-primary {
    margin-top: 26px;
    width: 100%;
    padding: 17px;
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
    color: #fff;
    box-shadow:
      0 10px 30px -10px rgba(168, 85, 247, 0.6),
      0 0 0 1px rgba(255,255,255,0.1) inset,
      0 1px 0 rgba(255,255,255,0.25) inset;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow:
      0 16px 40px -10px rgba(236, 72, 153, 0.7),
      0 0 0 1px rgba(255,255,255,0.15) inset,
      0 1px 0 rgba(255,255,255,0.3) inset;
  }
  .btn-primary:active { transform: translateY(0); }

  .error {
    color: #fca5a5;
    font-size: 0.85em;
    margin-top: 14px;
    min-height: 20px;
    opacity: 0;
    transition: opacity 0.3s;
    font-weight: 500;
  }
  .error.show { opacity: 1; }

  .shake { animation: shakeCard 0.5s ease; }
  @keyframes shakeCard {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  /* ================================================
     READING CARD (chapter view)
     ================================================ */
  .chapter-card {
    padding: 52px 46px;
    min-height: 520px;
    display: flex;
    flex-direction: column;
  }

  .chapter-head {
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .chapter-label {
    display: inline-block;
    font-size: 0.72em;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(236, 72, 153, 0.9);
    font-weight: 600;
    margin-bottom: 10px;
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(236, 72, 153, 0.1);
    border: 1px solid rgba(236, 72, 153, 0.2);
  }

  .chapter-title {
    font-size: 1.85em;
    font-weight: 700;
    background: linear-gradient(135deg, #ffffff 0%, #e9d5ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .chapter-date {
    font-size: 0.85em;
    color: rgba(255, 255, 255, 0.4);
    font-weight: 400;
    font-style: italic;
  }

  .chapter-body {
    flex: 1;
    color: rgba(255, 255, 255, 0.85);
    font-size: 1.02em;
    line-height: 1.9;
    font-weight: 400;
  }

  .chapter-body p {
    margin-bottom: 16px;
  }

  .chapter-body .drop-cap::first-letter {
    font-size: 3.2em;
    float: left;
    line-height: 0.9;
    padding: 6px 12px 0 0;
    font-weight: 700;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .chapter-body .hl {
    color: #f9a8d4;
    font-weight: 600;
  }

  .signature {
    margin-top: auto;
    padding-top: 24px;
    font-size: 0.92em;
    color: rgba(255, 255, 255, 0.5);
    font-style: italic;
    text-align: right;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }

  /* ================================================
     IN-PAGE BUTTONS
     ================================================ */
  .btn-soft {
    padding: 13px 24px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #fff;
    font-size: 0.93em;
    backdrop-filter: blur(10px);
    margin-top: 14px;
    align-self: flex-start;
  }
  .btn-soft:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
  }

  .btn-accent {
    padding: 13px 26px;
    border-radius: 14px;
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
    color: #fff;
    font-size: 0.93em;
    margin-top: 14px;
    align-self: flex-start;
    box-shadow:
      0 8px 24px -8px rgba(168, 85, 247, 0.6),
      0 1px 0 rgba(255,255,255,0.2) inset;
  }
  .btn-accent:hover {
    transform: translateY(-2px);
    box-shadow:
      0 12px 32px -8px rgba(236, 72, 153, 0.7),
      0 1px 0 rgba(255,255,255,0.25) inset;
  }

  .btn-icon { width: 17px; height: 17px; fill: currentColor; flex-shrink: 0; }

  /* ================================================
     JOKE BOX
     ================================================ */
  .joke-box {
    padding: 20px 22px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(236, 72, 153, 0.05));
    border: 1px solid rgba(168, 85, 247, 0.2);
    color: rgba(255, 255, 255, 0.9);
    font-size: 1em;
    line-height: 1.75;
    margin: 8px 0 14px;
    min-height: 90px;
    display: flex;
    align-items: center;
    transition: opacity 0.3s;
    font-style: italic;
  }

  /* ================================================
     QUESTION
     ================================================ */
  .question-text {
    font-size: 1.3em;
    font-weight: 500;
    text-align: center;
    margin: 26px 0 34px;
    color: rgba(255, 255, 255, 0.95);
    line-height: 1.5;
    letter-spacing: -0.3px;
  }

  .qa-row {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    min-height: 70px;
    position: relative;
  }

  .qa-btn {
    padding: 15px 38px;
    border-radius: 16px;
    font-family: inherit;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    border: none;
    letter-spacing: 0.3px;
  }

  .qa-yes {
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
    color: #fff;
    box-shadow:
      0 12px 30px -10px rgba(168, 85, 247, 0.6),
      0 1px 0 rgba(255,255,255,0.2) inset;
  }
  .qa-yes:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 18px 40px -10px rgba(236, 72, 153, 0.8);
  }

  .qa-no {
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .qa-no:hover { background: rgba(255, 255, 255, 0.1); }

  .no-hint {
    font-size: 0.9em;
    color: rgba(249, 168, 212, 0.9);
    text-align: center;
    margin-top: 18px;
    min-height: 22px;
    opacity: 0;
    transition: opacity 0.4s;
    font-style: italic;
  }

  /* ================================================
     FINAL SCREEN
     ================================================ */
  .final-heart {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    transform: rotate(-45deg);
    position: relative;
    margin: 8px auto 36px;
    animation: heartbeat 1.4s ease-in-out infinite;
    box-shadow: 0 0 50px rgba(236, 72, 153, 0.7);
  }
  .final-heart::before, .final-heart::after {
    content: '';
    position: absolute;
    width: 64px; height: 64px;
    background: inherit;
    border-radius: 50%;
  }
  .final-heart::before { top: -32px; left: 0; }
  .final-heart::after  { top: 0; left: 32px; }
  @keyframes heartbeat {
    0%, 100% { transform: rotate(-45deg) scale(1); }
    25%      { transform: rotate(-45deg) scale(1.12); }
    50%      { transform: rotate(-45deg) scale(1); }
    75%      { transform: rotate(-45deg) scale(1.08); }
  }

  .final-title {
    font-size: 1.9em;
    font-weight: 700;
    text-align: center;
    margin-bottom: 18px;
    background: linear-gradient(135deg, #ffffff 0%, #fbcfe8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  .final-text {
    font-size: 1em;
    color: rgba(255, 255, 255, 0.75);
    line-height: 1.9;
    text-align: center;
    margin-bottom: 20px;
  }

  /* ================================================
     NAVIGATION
     ================================================ */
  .nav-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 22px;
    flex-wrap: wrap;
  }

  .nav-btn {
    padding: 14px 28px;
    border-radius: 14px;
    font-family: inherit;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    border: none;
    letter-spacing: 0.3px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }

  .nav-prev {
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(10px);
  }
  .nav-prev:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
  }

  .nav-next {
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
    color: #fff;
    box-shadow:
      0 10px 28px -10px rgba(168, 85, 247, 0.6),
      0 1px 0 rgba(255,255,255,0.2) inset;
  }
  .nav-next:hover {
    transform: translateY(-2px);
    box-shadow:
      0 16px 36px -10px rgba(236, 72, 153, 0.75),
      0 1px 0 rgba(255,255,255,0.25) inset;
  }

  .nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none !important;
  }

  /* ================================================
     PROGRESS DOTS
     ================================================ */
  .dots {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 22px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
  }
  .dot.active {
    background: linear-gradient(135deg, #a855f7, #ec4899);
    width: 24px;
    border-radius: 4px;
    box-shadow: 0 0 12px rgba(236, 72, 153, 0.6);
  }

  /* ================================================
     MUSIC BADGE
     ================================================ */
  .music-badge {
    position: fixed;
    top: 18px;
    right: 18px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 40px;
    padding: 9px 18px;
    font-size: 0.82em;
    color: rgba(255, 255, 255, 0.85);
    z-index: 100;
    display: none;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    font-weight: 500;
  }
  .music-badge.show { display: flex; animation: screenIn 0.5s ease; }

  .music-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
  }
  .music-bars span {
    width: 3px;
    background: linear-gradient(180deg, #a855f7, #ec4899);
    border-radius: 2px;
    animation: barPulse 0.9s ease-in-out infinite;
  }
  .music-bars span:nth-child(1) { animation-delay: 0s; height: 6px; }
  .music-bars span:nth-child(2) { animation-delay: 0.15s; height: 10px; }
  .music-bars span:nth-child(3) { animation-delay: 0.3s; height: 8px; }
  .music-bars span:nth-child(4) { animation-delay: 0.45s; height: 12px; }
  @keyframes barPulse {
    0%, 100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1); }
  }

  /* ================================================
     RESPONSIVE
     ================================================ */
  @media (max-width: 640px) {
    body { padding: 14px 10px; }
    .glass { padding: 36px 26px; border-radius: 24px; }
    .chapter-card { padding: 38px 26px; min-height: 480px; }
    .login-title { font-size: 1.5em; }
    .chapter-title { font-size: 1.5em; }
    .chapter-body { font-size: 0.96em; line-height: 1.85; }
    .chapter-body .drop-cap::first-letter { font-size: 2.6em; padding: 4px 8px 0 0; }
    .lock-wrap { width: 70px; height: 70px; margin-bottom: 18px; }
    .lock-svg { width: 32px; height: 32px; }
    .question-text { font-size: 1.15em; margin: 20px 0 26px; }
    .qa-btn { padding: 13px 28px; font-size: 0.95em; }
    .nav-btn { padding: 12px 20px; font-size: 0.88em; }
    .final-title { font-size: 1.55em; }
    .final-heart { width: 52px; height: 52px; }
    .final-heart::before, .final-heart::after { width: 52px; height: 52px; }
    .final-heart::before { top: -26px; }
    .final-heart::after { left: 26px; }
    .music-badge { top: 10px; right: 10px; padding: 7px 13px; font-size: 0.72em; }
  }

  @media (max-width: 400px) {
    .glass { padding: 30px 20px; }
    .chapter-card { padding: 30px 20px; }
    .chapter-body { font-size: 0.92em; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>

<div class="music-badge" id="musicBadge">
  <div class="music-bars"><span></span><span></span><span></span><span></span></div>
  <span>Playing</span>
</div>

<!-- ============ SCREEN 1: LOGIN ============ -->
<div class="screen active" id="screenLogin">
  <div class="glass login-card" id="loginCard">
    <div class="lock-wrap">
      <svg class="lock-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 8V6a3 3 0 0 1 6 0v3H9zm3 5a2 2 0 0 1 1 3.73V19a1 1 0 0 1-2 0v-1.27A2 2 0 0 1 12 14z" fill="url(#lockGrad)"/>
        <defs>
          <linearGradient id="lockGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#c084fc"/>
            <stop offset="100%" stop-color="#f472b6"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <h1 class="login-title">Ek Khaas Sandesh</h1>
    <p class="login-sub">Subhashree ji, yeh sirf aapke liye hai.<br>Kholne ke liye apna sanket daaliye.</p>
    <input type="password" inputmode="numeric" maxlength="6" class="pin-input" id="pinInput" placeholder="SANKET" autocomplete="off">
    <p class="hint">Sanket: aapki pasandeeda tareekh (digit mein)</p>
    <button class="btn btn-primary" onclick="checkPin()">Kholiye</button>
    <p class="error" id="errorMsg">Yeh sanket sahi nahi hai. Kripya punah prayas kijiye.</p>
  </div>
</div>

<!-- ============ SCREEN 2: READING ============ -->
<div class="screen" id="screenRead">
  <div class="glass chapter-card" id="chapterCard">
    <div class="chapter-head">
      <span class="chapter-label" id="chapterLabel">Chapter 01</span>
      <h2 class="chapter-title" id="chapterTitle"></h2>
      <p class="chapter-date" id="chapterDate"></p>
    </div>
    <div class="chapter-body" id="chapterBody"></div>
  </div>

  <div class="dots" id="dotsRow"></div>

  <div class="nav-row">
    <button class="nav-btn nav-prev" id="prevBtn" onclick="prevPage()">
      <svg class="btn-icon" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7z"/></svg>
      Pichla
    </button>
    <button class="nav-btn nav-next" id="nextBtn" onclick="nextPage()">
      Agla
      <svg class="btn-icon" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7z"/></svg>
    </button>
  </div>
</div>

<audio id="voiceAudio" preload="auto" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3" type="audio/mpeg">
</audio>

<script>
  /* ===== Stars ===== */
  for (let i = 0; i < 55; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = Math.random() * 4 + 's';
    s.style.animationDuration = (3 + Math.random() * 3) + 's';
    document.body.appendChild(s);
  }

  function goTo(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ===== PIN + autoplay music after login ===== */
  const VALID_CODES = ['02', '2', '0206', '02062025', '062'];
  const voiceAudio = document.getElementById('voiceAudio');
  let voicePlaying = false;

  function checkPin() {
    const input = document.getElementById('pinInput').value.trim();
    const card = document.getElementById('loginCard');
    const error = document.getElementById('errorMsg');

    if (VALID_CODES.includes(input)) {
      error.classList.remove('show');
      goTo('screenRead');
      renderPage();
      setTimeout(() => {
        voiceAudio.volume = 0.4;
        voiceAudio.play().then(() => {
          voicePlaying = true;
          document.getElementById('musicBadge').classList.add('show');
        }).catch(() => {
          voicePlaying = false;
        });
      }, 600);
    } else {
      card.classList.add('shake');
      error.classList.add('show');
      setTimeout(() => card.classList.remove('shake'), 500);
      document.getElementById('pinInput').value = '';
    }
  }
  document.getElementById('pinInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') checkPin();
  });
  document.getElementById('pinInput').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
  });

  /* ============================================================
     PAGES (10 chapters)
     ============================================================ */
  const PAGES = [
    {
      title: "Ek Chhoti Si Shuruwat",
      date: "Kewal Subhashree ji ke liye",
      label: "Chapter 01",
      html: `
        <p class="drop-cap">Subhashree ji, yeh sandesh maine sirf ek hi kaaran se likha hai &mdash; aapko batane ke liye ki main kitna kshama maangta hoon, aur aapse kitna prem karta hoon.</p>
        <p>Mujhe gyaan hai ki aap naraaz hain, aur iska haqdaar bhi hoon main.</p>
        <p>Kintu ise padhte hue, meri ek hi ichha hai &mdash; ki aapke chehre par ek chhoti si muskaan aa jaye.</p>
        <p>Har panne par kuch naya likha hai. Aap kripya padhti rahiye&hellip;</p>
        <div class="signature">&mdash; Aapka, sadaiv</div>
      `
    },
    {
      title: "Kshama",
      date: "Hriday se, baar-baar",
      label: "Chapter 02",
      html: `
        <p>Maine aapko rulaya. Maine aapko akela mehsoos karaya. Aur shayad, maine aapko woh diya jo aapne kabhi arjun nahi kiya &mdash; dukh.</p>
        <p>Main yeh nahi keh raha ki mera koi kasoor nahi tha. Kasoor tha. <span class="hl">Purna kasoor mera tha.</span></p>
        <p>Kintu ek baat suniye&hellip; main us insaan se alag hoon jo galti karke bhaag jaata hai. Main yahan hoon. Aapke samaksh. Kshama maangte hue.</p>
        <p>Kshama kijiye. Hriday se kshama kijiye.</p>
      `
    },
    {
      title: "Meri Awaaz",
      date: "Ek sandesh, aapke liye",
      label: "Chapter 03",
      html: `
        <p>Kuch baatein likhkar nahi keh sakta. Isliye ek chhota sa sandesh bhej raha hoon&hellip;</p>
        <p>Kripya suniye. Bas ek baar.</p>
        <button class="btn btn-soft" onclick="toggleVoice()" id="voiceBtnLeft" style="margin-top:20px;">
          <svg class="btn-icon" viewBox="0 0 24 24" id="voiceIconLeft">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <span id="voiceLabelLeft">Meri Awaaz Suniye</span>
        </button>
        <p style="margin-top:22px; font-style:italic; color:#f9a8d4;">&ldquo;Main aapko kabhi akela nahi chhodunga. Yeh mera vachan hai.&rdquo;</p>
      `
    },
    {
      title: "Meri Galtiyan",
      date: "Saaf-saaf, bina bahana",
      label: "Chapter 04",
      html: `
        <p>1. Maine aapki baat dhyan se nahi suni, jab aap sunna chahti thi.</p>
        <p>2. Maine apne ahankar ko aapse upar rakha, jo galat tha.</p>
        <p>3. Maine aapko woh samay nahi diya jo aap arjun karti thi.</p>
        <p>4. Maine aapko rulaya, jab aapko sahara chahiye tha.</p>
        <p>Yeh galtiyan hain. Bahane nahi. Aur main inhe sudhaarunga.</p>
      `
    },
    {
      title: "Kuch Hansi Ki Baatein",
      date: "Kyunki aapki muskaan meri duniya hai",
      label: "Chapter 05",
      html: `
        <p>Ab kripya thoda halka mehsoos kijiye. Neeche diye button ko dabate rahiye, har baar naya halka-phulka vinyas aayega.</p>
        <div class="joke-box" id="jokeBox">Yahan pehla vinyas aayega&hellip; button dabaiye.</div>
        <button class="btn btn-accent" onclick="nextJoke()">
          <svg class="btn-icon" viewBox="0 0 24 24">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-4 7a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0zm8 0a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0zm-8.5 5.5h9a.75.75 0 0 1 0 1.5h-9a.75.75 0 0 1 0-1.5z"/>
          </svg>
          Ek Aur Dikhayiye
        </button>
      `
    },
    {
      title: "Aapke Baare Mein",
      date: "Jo main kabhi keh nahi paaya",
      label: "Chapter 06",
      html: `
        <p>Aap hansti hain toh lagta hai jaise poori srishti ruk gayi ho.</p>
        <p>Aap naraaz hoti hain toh bhi sundar lagti hain &mdash; kintu woh naraazgi mujhe andar se tod deti hai.</p>
        <p>Aap jab &ldquo;hmm&rdquo; kehti hain, main us ek shabd mein poori kahaani padh leta hoon.</p>
        <p>Aap meri zindagi ka woh anmol hissa hain jo main khona nahi chahta. <span class="hl">Kabhi nahi.</span></p>
      `
    },
    {
      title: "Ek Chhota Sa Anurodh",
      date: "Ab bas yeh bata dijiye&hellip;",
      label: "Chapter 07",
      html: `
        <p class="question-text" id="questionText">Kya aap mujhe kshama kar sakti hain?</p>
        <div class="qa-row" id="qaRow">
          <button class="qa-btn qa-yes" id="yesBtn" onclick="sayYes()">Haan</button>
          <button class="qa-btn qa-no" id="noBtn" onclick="sayNo()">Nahi</button>
        </div>
        <p class="no-hint" id="noHint"></p>
      `
    },
    {
      title: "Ek Vachan",
      date: "Likh kar deta hoon",
      label: "Chapter 08",
      html: `
        <p>Main vachan deta hoon&hellip;</p>
        <p>1. Aapki baat dhyan se sununga, bina beech mein bole.</p>
        <p>2. Aapka poora khayal rakhunga &mdash; bhojan, aaram, swasthya, sab.</p>
        <p>3. Aapko kabhi akela mehsoos nahi karne dunga.</p>
        <p>4. Aur jab aap naraaz hongi, main koi halka vinyas sunaunga &mdash; jab tak aap has na dein.</p>
        <p style="font-style:italic; color:#f9a8d4;">Yeh vachan hai. Toota toh&hellip; aap bata dijiye, main sudhar jaunga.</p>
      `
    },
    {
      title: "Dhanyavaad",
      date: "Hriday se",
      label: "Chapter 09",
      html: `
        <p>Yeh sandesh samapt ho raha hai&hellip; kintu humari kahaani nahi.</p>
        <p>Aap meri zindagi mein hain, yeh meri sabse badi khushi hai. Aur main is khushi ko kabhi khona nahi chahta.</p>
        <p>Kripya apna poora khayal rakhiye. Samay par bhojan kijiye, aaram kijiye. <span class="hl">Aapka swasthya sarvopari hai.</span></p>
        <div class="signature">&mdash; Aapka, sadaiv</div>
      `
    },
    {
      title: "Kshama, Subhashree ji",
      date: "Antim panza",
      label: "Chapter 10",
      html: `
        <div class="final-heart"></div>
        <p class="final-text">
          Yadi aap yahan tak padh aayi hain, toh samajhiye&hellip;<br>
          aapne mujhe ek avsar diya hai.<br><br>
          Kripya apna poora khayal rakhiye. Aap theek rahiye &mdash; bas itni si meri kaamna hai.
        </p>
      `
    }
  ];

  let currentPage = 0;

  /* Build dots */
  const dotsRow = document.getElementById('dotsRow');
  PAGES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => { currentPage = i; renderPage(); };
    dotsRow.appendChild(d);
  });

  function renderPage() {
    const p = PAGES[currentPage];
    document.getElementById('chapterLabel').textContent = p.label;
    document.getElementById('chapterTitle').textContent = p.title;
    document.getElementById('chapterDate').textContent = p.date;
    document.getElementById('chapterBody').innerHTML = p.html;

    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage === PAGES.length - 1;

    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === currentPage);
    });

    updateVoiceButtons();
  }

  function nextPage() {
    if (currentPage < PAGES.length - 1) {
      currentPage++;
      renderPage();
    }
  }
  function prevPage() {
    if (currentPage > 0) {
      currentPage--;
      renderPage();
    }
  }

  /* ===== Voice ===== */
  function updateVoiceButtons() {
    const l1 = document.getElementById('voiceLabelLeft');
    const i1 = document.getElementById('voiceIconLeft');
    if (!l1) return;
    if (voicePlaying) {
      l1.textContent = 'Rukiye...';
      if (i1) i1.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    } else {
      l1.textContent = 'Meri Awaaz Suniye';
      if (i1) i1.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
  }

  function toggleVoice() {
    if (voicePlaying) {
      voiceAudio.pause();
      voiceAudio.currentTime = 0;
      voicePlaying = false;
      updateVoiceButtons();
      document.getElementById('musicBadge').classList.remove('show');
    } else {
      voiceAudio.volume = 0.4;
      voiceAudio.play().then(() => {
        voicePlaying = true;
        updateVoiceButtons();
        document.getElementById('musicBadge').classList.add('show');
      }).catch(() => {
        const l1 = document.getElementById('voiceLabelLeft');
        if (l1) l1.textContent = 'Punah Dabaiye';
      });
    }
  }

  /* ===== Jokes ===== */
  const jokes = [
    "Mujhe vyayamshala chhodni padi &mdash; kyunki aapke saamne toh main pehle se hi bhaavuk hoon, sharirik nahi.",
    "Chikitsak ne kaha aaram kijiye. Maine kaha &mdash; pehle Subhashree ji ka naraazgi theek ho jaye, phir sochunga.",
    "Meri yantra ki battery 1% par aati hai toh main charger dhoondhta hoon. Aapki muskaan 1% par aati hai toh main duniya bhool jaata hoon.",
    "Aapke bina main aisa hoon jaise bina internet ke phone &mdash; juda dikhta hoon, kintu kaam nahi karta.",
    "Google se poocha &mdash; 'sabse sundar mahila kaun?' Google boli &mdash; 'bhai, aap pehle se jaante hain, jaakar kshama maang lijiye.'",
    "Aap naraaz hoti hain toh bhi sundar lagti hain. Kintu aap hansti hain toh samay ruk jaata hai. Kripya, thodi si muskaan dijiye.",
    "Mera priya samay? Jab aap 'kshama' ke baad 'chalega' kehti hain.",
    "Zindagi mein do cheezein mahatvapurna hain &mdash; chai aur aapki muskaan. Chai mil jaati hai, muskaan ke liye kshama maang raha hoon."
  ];
  let jokeIndex = 0;

  function nextJoke() {
    const jokeBox = document.getElementById('jokeBox');
    if (!jokeBox) return;
    jokeBox.style.opacity = 0;
    setTimeout(() => {
      jokeBox.innerHTML = jokes[jokeIndex % jokes.length];
      jokeBox.style.opacity = 1;
      jokeIndex++;
    }, 180);
  }

  /* ===== Q&A ===== */
  let noCount = 0;
  const noResponses = [
    "Nahi dabaya? Koi baat nahi, main pratiksha karunga.",
    "Ab bhi nahi? Dekhiye, teddy bhi udaas ho raha hai.",
    "Theek hai, ek aur avsar dijiye&hellip; kripya.",
    "Aapki muskaan toh 'haan' keh rahi hai. Bas ek chhota sa chinh.",
    "Chaliye, main pratiksha karunga. Kintu 'Nahi' button dheere-dheere bhaag raha hai.",
    "Aakhri baar anurodh kar raha hoon&hellip; kripya."
  ];

  function sayNo() {
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const noHint = document.getElementById('noHint');
    if (!noBtn) return;

    noCount++;
    const x = (Math.random() - 0.5) * 150;
    const y = (Math.random() - 0.5) * 50;
    noBtn.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
    noBtn.style.fontSize = Math.max(0.7, 1 - noCount * 0.06) + 'em';

    if (yesBtn) yesBtn.style.transform = 'scale(' + Math.min(1.5, 1 + noCount * 0.1) + ')';

    if (noCount <= noResponses.length && noHint) {
      noHint.textContent = noResponses[noCount - 1];
      noHint.style.opacity = 1;
    }
    if (noCount >= 6) {
      noBtn.style.opacity = 0;
      noBtn.style.pointerEvents = 'none';
    }
  }

  function sayYes() {
    currentPage = PAGES.length - 1;
    renderPage();
    if (!voicePlaying) {
      setTimeout(() => {
        voiceAudio.volume = 0.4;
        voiceAudio.play().then(() => {
          voicePlaying = true;
          updateVoiceButtons();
          document.getElementById('musicBadge').classList.add('show');
        }).catch(() => {});
      }, 800);
    }
  }
</script>

</body>
</html>
